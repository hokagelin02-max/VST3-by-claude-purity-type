name: Build Windows installer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DTAPEROMP_COPY=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Make installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\TapeRomp.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: TapeRomp-Setup
          path: dist/TapeRomp-Setup.exe
